name: Pinact

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/pinact.yaml
      - .github/actions/**
      - .github/workflows/*.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  pinact:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Pinact
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: "true"
          min_age: "7"
